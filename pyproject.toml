[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegislog-ai"
version = "1.3.1"
description = "Terminal-first defensive AI log analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "HR-Presents"}]
keywords = ["cli", "logs", "security", "observability", "incident-response"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Logging",
]
dependencies = ["rich>=13.7", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "bandit>=1.7", "build>=1.2", "pip-audit>=2.7", "twine>=5.1"]

[project.urls]
Homepage = "https://github.com/HR-Presents/AegisLog-AI"
Documentation = "https://github.com/HR-Presents/AegisLog-AI#readme"
Issues = "https://github.com/HR-Presents/AegisLog-AI/issues"
Source = "https://github.com/HR-Presents/AegisLog-AI"

[project.scripts]
aegislog = "aegislog.entry:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
