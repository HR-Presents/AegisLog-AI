name: User review
about: Share your experience using AegisLog so maintainers and future users can learn from it.
title: "[Review]: "
labels: ["user-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using AegisLog. Reviews are public and help improve the project.

        Please do not include real logs, credentials, tokens, personal data, internal hostnames, or other sensitive information.

  - type: dropdown
    id: rating
    attributes:
      label: Overall rating
      description: How would you rate your experience with AegisLog?
      options:
        - "10 / 10"
        - "9 / 10"
        - "8 / 10"
        - "7 / 10"
        - "6 / 10"
        - "5 / 10"
        - "4 / 10"
        - "3 / 10"
        - "2 / 10"
        - "1 / 10"
    validations:
      required: true

  - type: dropdown
    id: recommend
    attributes:
      label: Would you recommend AegisLog?
      options:
        - "Yes"
        - "Maybe"
        - "No"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AegisLog version
      description: Use the release version or commit/build identifier if known.
      placeholder: "v1.6.0"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: How did you run AegisLog?
      options:
        - "Windows standalone EXE"
        - "Python package / source"
        - "Other"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, etc."
    validations:
      required: true

  - type: checkboxes
    id: workflows
    attributes:
      label: What did you use?
      options:
        - label: File analysis / dashboard
        - label: Live monitoring
        - label: Multi-source monitoring
        - label: Native telemetry
        - label: Incident investigation
        - label: HTML / PDF investigation report
        - label: Other commands

  - type: textarea
    id: liked
    attributes:
      label: What worked well?
      description: Tell us what was useful, clear, fast, or trustworthy.
    validations:
      required: true

  - type: textarea
    id: improve
    attributes:
      label: What should we improve?
      description: Specific examples are more useful than a score alone.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Optional suggestions or context. Keep all examples sanitized.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public review confirmation
      options:
        - label: I understand this review is public on GitHub and I have removed sensitive data.
          required: true
