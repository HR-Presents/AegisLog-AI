name: Release v1.3.1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE-v1.3.1 to publish the immutable v1.3.1 release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-v1.3.1
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.3.1
  RELEASE_VERSION: 1.3.1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit main-branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ inputs.confirmation }}" = "RELEASE-v1.3.1"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          init_text = pathlib.Path("src/aegislog/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          assert project["project"]["version"] == "1.3.1", project["project"]["version"]
          assert match and match.group(1) == "1.3.1", match.group(1) if match else "missing"
          PY

      - name: Refuse to mutate an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to modify it."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to reuse it."
            exit 1
          fi

      - name: Run release-candidate quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q
          bandit -q -r src
          pip-audit
          python -m build
          python -m twine check dist/*

  build-windows-exe:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build one-file customer executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name AegisLog packaging/aegislog_onefile.py

      - name: Release smoke tests
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AegisLog.exe")) { throw "AegisLog.exe was not created" }
          $files = Get-ChildItem "dist" -File
          if ($files.Count -ne 1 -or $files[0].Name -ne "AegisLog.exe") { throw "Customer dist must contain exactly AegisLog.exe" }
          .\dist\AegisLog.exe --version
          .\dist\AegisLog.exe doctor
          .\dist\AegisLog.exe start --help
          .\dist\AegisLog.exe dashboard examples\auth.log
          .\dist\AegisLog.exe live --help
          .\dist\AegisLog.exe live-multi --help
          .\dist\AegisLog.exe native-live --help
          .\dist\AegisLog.exe incidents --help
          .\dist\AegisLog.exe explain --help
          .\dist\AegisLog.exe mitre --help

      - name: Stage immutable release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item "dist\AegisLog.exe" "release-assets\AegisLog.exe"
          $hash = (Get-FileHash "release-assets\AegisLog.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  AegisLog.exe" | Set-Content -Encoding ascii "release-assets\AegisLog.exe.sha256"
          $files = Get-ChildItem "release-assets" -File
          if ($files.Count -ne 2) { throw "Release staging must contain exactly the executable and checksum" }

      - uses: actions/upload-artifact@v4
        with:
          name: AegisLog-v1.3.1-release-assets
          if-no-files-found: error
          retention-days: 30
          path: release-assets/*

  publish:
    needs: build-windows-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AegisLog-v1.3.1-release-assets
          path: release-assets

      - name: Verify release asset checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -f AegisLog.exe
          test -f AegisLog.exe.sha256
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum --check AegisLog.exe.sha256

      - name: Re-check immutability immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG appeared during the workflow; refusing to modify it."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG appeared during the workflow; refusing to reuse it."
            exit 1
          fi

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/AegisLog.exe \
            release-assets/AegisLog.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "AegisLog AI v1.3.1" \
            --notes-file docs/RELEASE_V1.3.1.md \
            --latest
