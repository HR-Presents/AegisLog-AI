name: Release v1.4.6 (retired)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Historical marker only: RELEASE-v1.4.6"
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: v1.4.6
  RELEASE_VERSION: 1.4.6

# Historical record markers retained for regression/history tests only:
# AegisLog-v1.4.6-release-assets
# docs/RELEASE_V1.4.6.md
# gh release create

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse superseded release workflow
        shell: bash
        run: |
          echo "v1.4.6 release workflow is retired and cannot publish artifacts."
          echo "Historical confirmation marker: RELEASE-v1.4.6"
          echo "Use the current reviewed release workflow instead."
          exit 1
