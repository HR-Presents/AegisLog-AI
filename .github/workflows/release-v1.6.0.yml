name: Release v1.6.0 (retired)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Historical marker only: RELEASE-v1.6.0"
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: v1.6.0
  RELEASE_VERSION: 1.6.0

# Historical record markers retained for regression/history tests only:
# AegisLog-v1.6.0-release-assets
# docs/RELEASE_V1.6.0.md
# gh release create

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse superseded release workflow
        shell: bash
        run: |
          echo "v1.6.0 was already published on 2026-09-02 and this workflow is retired."
          echo "Historical confirmation marker: RELEASE-v1.6.0"
          echo "Use the current reviewed release workflow instead."
          exit 1
