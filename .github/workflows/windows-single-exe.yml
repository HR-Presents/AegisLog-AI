name: Windows single executable

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build AegisLog.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name AegisLog packaging/aegislog_onefile.py

      - name: Verify single executable and core command surface
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AegisLog.exe")) { throw "AegisLog.exe was not created" }
          .\dist\AegisLog.exe --version
          .\dist\AegisLog.exe doctor
          .\dist\AegisLog.exe start --help
          .\dist\AegisLog.exe dashboard examples\auth.log
          .\dist\AegisLog.exe live --help
          .\dist\AegisLog.exe live-multi --help
          .\dist\AegisLog.exe native-sources
          .\dist\AegisLog.exe native-live --help
          .\dist\AegisLog.exe incidents --help
          .\dist\AegisLog.exe investigate --help
          .\dist\AegisLog.exe explain --help
          .\dist\AegisLog.exe mitre --help

      - name: Verify distribution is exactly one executable
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist" -File
          if ($files.Count -ne 1) { throw "Expected exactly one customer executable in dist" }
          if ($files[0].Name -ne "AegisLog.exe") { throw "Unexpected distribution file: $($files[0].Name)" }

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\AegisLog.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  AegisLog.exe" | Set-Content -Encoding ascii "AegisLog.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: AegisLog-Windows-Single-EXE
          if-no-files-found: error
          path: |
            dist/AegisLog.exe
            AegisLog.exe.sha256
