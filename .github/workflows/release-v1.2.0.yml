name: Release v1.2.0

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release-windows-exe:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version.Trim() -ne "1.2.0") { throw "Expected version 1.2.0, got $version" }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build AegisLog.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name AegisLog packaging/aegislog_onefile.py

      - name: Verify release executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AegisLog.exe")) { throw "AegisLog.exe was not created" }
          $files = Get-ChildItem "dist" -File
          if ($files.Count -ne 1) { throw "Expected exactly one executable in dist" }
          if ($files[0].Name -ne "AegisLog.exe") { throw "Unexpected distribution file: $($files[0].Name)" }
          .\dist\AegisLog.exe --version
          .\dist\AegisLog.exe doctor
          .\dist\AegisLog.exe start --help
          .\dist\AegisLog.exe dashboard examples\auth.log

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\AegisLog.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  AegisLog.exe" | Set-Content -Encoding ascii "dist\AegisLog.exe.sha256"

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## AegisLog AI v1.2.0

          AegisLog AI v1.2.0 delivers the polished single-file Windows experience and improved defensive log intelligence.

          ### Highlights
          - One customer execution file: `AegisLog.exe`
          - No Python installation or separate dependency folder required for Windows execution
          - Double-click opens the terminal control center
          - Improved syslog and journald parsing
          - Better log-level inference
          - Smarter authentication and brute-force correlation
          - Suspicious web probing detection including `.env` and `wp-login.php`
          - Firewall block and service-failure detection
          - Lower-noise anomaly scoring
          - Improved terminal dashboard and EXE-aware follow-up commands
          - Defensive, local-first, read-only analysis posture preserved

          ### Windows customer use
          1. Download `AegisLog.exe`.
          2. Double-click it.
          3. Choose **Analyze a log file**.
          4. Enter the path to the log file.

          Advanced users can also run commands such as:
          `AegisLog.exe dashboard C:\path\to\logfile.log`

          ### Verification
          `AegisLog.exe.sha256` contains the SHA-256 checksum for the release executable.

          Note: this executable is currently unsigned, so Windows SmartScreen may show a warning until Authenticode signing is added.
          '@ | Set-Content -Encoding utf8 "release-notes.md"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if (gh release view v1.2.0 *> $null) {
            gh release upload v1.2.0 "dist\AegisLog.exe" "dist\AegisLog.exe.sha256" --clobber
          } else {
            gh release create v1.2.0 `
              --target "$env:TARGET_SHA" `
              --title "AegisLog AI v1.2.0" `
              --notes-file "release-notes.md" `
              "dist\AegisLog.exe" "dist\AegisLog.exe.sha256"
          }
