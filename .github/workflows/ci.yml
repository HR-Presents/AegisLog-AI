name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python tools/evaluate_detections.py evaluation/labeled_events.jsonl
      - name: Streaming benchmark
        if: matrix.python-version == '3.12'
        run: python benchmarks/stream_benchmark.py --lines 250000 --chunk-size 2000
      - run: bandit -q -r src
      - run: aegislog doctor
      - run: aegislog analyze examples/auth.log
