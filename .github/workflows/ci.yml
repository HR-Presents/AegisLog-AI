name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            validation-lock: packaging/validation-lock-py310-linux.txt
          - python-version: "3.11"
            validation-lock: packaging/validation-lock-py311-linux.txt
          - python-version: "3.12"
            validation-lock: packaging/validation-lock-py312-linux.txt
          - python-version: "3.13"
            validation-lock: packaging/validation-lock-py313-linux.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact compatibility-validation stack
        env:
          VALIDATION_LOCK: ${{ matrix.validation-lock }}
        run: |
          python -m pip install --require-hashes -r packaging/editable-build-backend.txt
          python -m pip install --require-hashes -r "$VALIDATION_LOCK"
          python -m pip install --require-hashes -r packaging/runtime-lock.txt
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip install --require-hashes -r packaging/build-lock-linux.txt
          fi
          python -m pip install -e . --no-deps --no-build-isolation
      - run: ruff check .
      - run: pytest -q
      - name: Detection regression gate
        run: >-
          python tools/evaluate_detections.py evaluation/labeled_events.jsonl
          --dataset-kind synthetic
          --min-precision 1.0
          --min-recall 1.0
          --min-case-accuracy 1.0
          --max-fp 0
          --max-fn 0
      - name: Streaming benchmark
        if: matrix.python-version == '3.12'
        run: python benchmarks/stream_benchmark.py --lines 250000 --chunk-size 2000
      - run: bandit -q -r src
      - name: Dependency audit
        if: matrix.python-version == '3.12'
        run: pip-audit
      - run: aegislog doctor
      - run: aegislog analyze examples/auth.log
