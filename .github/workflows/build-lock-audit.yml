name: Build toolchain lock audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build-lock:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            lock_name: linux
          - os: windows-2025
            lock_name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify exact build toolchain lock
        shell: bash
        env:
          BUILD_LOCK: packaging/build-lock-${{ matrix.lock_name }}.txt
        run: |
          set -euo pipefail
          python -m pip install --dry-run --ignore-installed --only-binary=:all: \
            -r packaging/build-tools.txt --report build-lock-report.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def canonical(name: str) -> str:
              return name.lower().replace("_", "-").replace(".", "-")

          report = json.loads(Path("build-lock-report.json").read_text(encoding="utf-8"))
          resolved = set()
          for item in report["install"]:
              name = canonical(item["metadata"]["name"])
              version = item["metadata"]["version"]
              algorithm, digest = item["download_info"]["archive_info"]["hash"].split("=", 1)
              resolved.add((name, version, algorithm, digest))

          locked = set()
          for raw in Path(os.environ["BUILD_LOCK"]).read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              requirement, hash_part = line.split(" --hash=", 1)
              name, version = requirement.split("==", 1)
              algorithm, digest = hash_part.split(":", 1)
              locked.add((canonical(name), version, algorithm, digest))

          if locked != resolved:
              print("Missing from lock:", sorted(resolved - locked))
              print("Unexpected in lock:", sorted(locked - resolved))
              raise SystemExit("Build lock does not match the direct build-tool resolution")
          print(f"Verified {len(locked)} exact locked build dependencies")
          PY
          rm -rf verified-build
          python -m pip download --only-binary=:all: --require-hashes \
            --dest verified-build -r "$BUILD_LOCK"
