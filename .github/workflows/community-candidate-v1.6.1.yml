name: Community candidate v1.6.1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BUILD-CANDIDATE-v1.6.1 to build an unsigned community candidate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: community-candidate-v1.6.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit candidate confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "BUILD-CANDIDATE-v1.6.1"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked validation and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r packaging/validation-lock-py312-linux.txt
          python -m pip install --require-hashes -r packaging/runtime-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Run candidate quality gates
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          pytest -q
          python tools/evaluate_detections.py evaluation/labeled_events.jsonl \
            --dataset-kind synthetic \
            --min-precision 1.0 \
            --min-recall 1.0 \
            --min-case-accuracy 1.0 \
            --max-fp 0 \
            --max-fn 0
          bandit -q -r src

  build-windows-candidate:
    needs: validate
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked build and runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r packaging/build-lock-windows.txt
          python -m pip install --require-hashes -r packaging/runtime-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Build unsigned one-file candidate
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --console --name AegisLog-community-candidate packaging/aegislog_onefile.py
      - name: Candidate smoke tests
        shell: pwsh
        run: |
          $exe = "dist\AegisLog-community-candidate.exe"
          if (-not (Test-Path $exe)) { throw "candidate executable was not created" }
          & $exe --version
          & $exe doctor
          & $exe start --help
          & $exe dashboard examples\auth.log
      - name: Assert candidate is not presented as production-signed
        shell: pwsh
        run: |
          $exe = "dist\AegisLog-community-candidate.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -eq [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Community candidate unexpectedly has a valid Authenticode signature; use the production release workflow for signed artifacts."
          }
      - name: Stage clearly labeled candidate artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "candidate-assets" | Out-Null
          Copy-Item "dist\AegisLog-community-candidate.exe" "candidate-assets\AegisLog-community-candidate.exe"
          $hash = (Get-FileHash "candidate-assets\AegisLog-community-candidate.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  AegisLog-community-candidate.exe" | Set-Content -Encoding ascii "candidate-assets\AegisLog-community-candidate.exe.sha256"
          @"
          AegisLog AI v1.6.1 community candidate

          This artifact is intentionally UNSIGNED and is NOT a production-trusted release.
          It is provided for development, testing, demos, and community evaluation.

          Production release requirements remain separate and include organization-controlled
          Windows signing, reviewed external detection evidence, exact-commit preflight,
          and explicit release authorization.

          Commit: $env:GITHUB_SHA
          "@ | Set-Content -Encoding utf8 "candidate-assets\README-CANDIDATE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AegisLog-v1.6.1-community-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: candidate-assets/*
